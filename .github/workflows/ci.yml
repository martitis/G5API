name: CI
on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build-lint:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn lint

  test:
    name: Integration tests (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Create config/test.json
        run: |
          node -e '
          const fs = require("fs");
          const c = JSON.parse(fs.readFileSync("config/test.json.template", "utf8"));
          c.server.dbKey = "ci-test-key-1234";
          c.test.user = "root";
          c.test.password = "root";
          fs.writeFileSync("config/test.json", JSON.stringify(c, null, 2));
          '
      # Same steps as `yarn test`, but every suite runs even after a failure, so one run shows all failures.
      - name: yarn test
        run: |
          set -o pipefail
          {
            yarn build && yarn test:unit && yarn test:setup-user && yarn migrate-drop-test && yarn migrate-create-test && yarn migrate-test-upgrade || exit 1
            failed=""
            for suite in user gameservers teams matches seasons vetoes mapstats playerstats vetosides maplists; do
              yarn "test:$suite" || failed="$failed $suite"
            done
            if [ -n "$failed" ]; then echo "Failed suites:$failed"; exit 1; fi
          } 2>&1 | tee test.log
      # Job logs need a GitHub login; annotations are visible to anyone, including the API.
      - name: Publish test log tail
        if: failure()
        run: |
          tail -n 80 test.log | sed 's/%/%25/g; s/\r//g' | awk 'BEGIN{ORS="%0A"} {print}' > tail.txt
          echo "::error title=yarn test (last 80 lines)::$(cat tail.txt)"
